services:
  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      # Host port for LAN sensors/bridges; override if 1883 is taken (MQTT_PORT=1884 docker compose up)
      - "${MQTT_PORT:-1883}:1883"
    volumes:
      - ./setup/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    restart: unless-stopped

  monitor:
    build: .
    depends_on:
      - mosquitto
    environment:
      MQTT_HOST: mosquitto
    volumes:
      - ./config:/app/config:ro
      - ./logs:/app/logs
    restart: unless-stopped

  dashboard:
    build: .
    command: ["python", "-m", "dashboard.server"]
    ports:
      - "8080:8080"
    volumes:
      - ./logs:/app/logs:ro
    restart: unless-stopped
