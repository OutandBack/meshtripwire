services:
  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - ./setup/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    restart: unless-stopped

  monitor:
    build: .
    depends_on:
      - mosquitto
    environment:
      MQTT_HOST: mosquitto
    volumes:
      - ./config:/app/config:ro
      - ./logs:/app/logs
    restart: unless-stopped

  nodered:
    image: nodered/node-red:latest
    ports:
      - "1880:1880"
    volumes:
      - nodered_data:/data
    restart: unless-stopped

volumes:
  nodered_data:
