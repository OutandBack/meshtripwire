[MQTT]
Host = localhost
Port = 1883
Topic = meshtastic/receive
# Optional broker credentials (Mosquitto 2.x disables anonymous access by default)
# Username = meshtripwire
# Password = changeme
# Optional TLS to the broker (typically Port = 8883; CAFile optional for self-signed certs)
# UseTLS = true
# CAFile = /etc/mosquitto/ca.crt

[Files]
Whitelist = config/whitelist.txt
Nodes = config/nodes.json
Database = logs/detections.db
# Delete detections older than this many days (0 = keep forever)
RetentionDays = 0

[Filtering]
# -75 suits WiFi/BLE proximity sensing (Paxcounter); LoRa mesh sightings via
# mqtt/serial_bridge.py arrive at -90..-120 dBm, so use -120 for those
RSSIMin = -120
EMAlpha = 0.6
# Timeout in seconds for removing unseen MACs from EMA state (1 hour)
StateTimeoutSeconds = 3600
# Minimum seconds between repeat alerts for the same unknown MAC
AlertCooldownSeconds = 300
# Only alert once a device has persisted at least this long (0 = alert on first sighting).
# Filters passers-by from lingerers — the single biggest false-positive reducer.
DwellSeconds = 0
# Minimum seconds between repeat vehicle alerts from the same QMC5883L node
VehicleAlertCooldownSeconds = 300

[Sensors]
# Comma-separated sensor/node ids to watch; empty disables offline alerts.
# A sensor is "alive" via any detection it reports or a heartbeat it publishes.
ExpectedSensors =
# Alert if an expected sensor is silent this long (seconds)
SensorTimeoutSeconds = 900
# Sensors may publish liveness here (a bare node id or {"node": id})
HeartbeatTopic = meshtripwire/heartbeat

[Arming]
# Armed window as HH:MM-HH:MM local time (wraps past midnight); empty = always armed.
# Alerts only fire while armed — set this to your away/asleep hours.
Schedule =
# Optional topic to manually arm/disarm (publish "armed", "disarmed", or "auto");
# a manual override beats the schedule until it expires or is set back to "auto".
# SECURITY: anyone who can publish here can disarm alerting, and anyone who can
# publish to HeartbeatTopic can mask a dead sensor. Protect the broker with
# auth/ACLs (see setup/mosquitto.conf). Empty disables.
ControlTopic = meshtripwire/arm
# Shared secret required on control messages: {"cmd":"disarmed","secret":"..."}.
# Strongly recommended whenever ControlTopic is set. Empty = accept bare commands.
ControlSecret =
# A manual arm/disarm auto-reverts to the schedule after this many seconds (0 = never).
# Finite by default so a stray or malicious "disarmed" can't disable alerts forever.
ControlOverrideTTL = 3600

[Logging]
Level = INFO
Format = %(asctime)s - %(levelname)s - %(message)s

[Notifications]
# Enable/disable specific notification channels
EnableNtfy = true
EnableWebhook = false
EnableTwilio = false
# Republish alerts as JSON on the broker (for Node-RED or mesh downlinks)
EnableMqtt = false
MqttAlertTopic = meshtripwire/alerts

# ntfy.sh settings.
# On the public ntfy.sh, the topic name IS the access control: anyone who knows
# it can read and post. Keep this long and random, and regenerate your own:
#   python -c "import secrets; print('meshtripwire-'+secrets.token_hex(12))"
NtfyTopic = meshtripwire-9578207750a5712f1d88a506
# For real auth, use an ntfy account or self-hosted server with access tokens:
# NtfyServer = https://ntfy.sh
# NtfyToken = tk_xxxxxxxxxxxxxxxxxxxx

# Webhook settings
WebhookURL = https://example.com/webhook

# Twilio SMS settings (Ensure these are kept secure!)
TwilioAccountSID = ACXXXXXXXXXXXXXXXXX
TwilioAuthToken = your_auth_token
TwilioFromPhone = +1234567890
TwilioToPhone = +1987654321
